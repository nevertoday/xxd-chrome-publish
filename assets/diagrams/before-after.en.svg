<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336" role="img" aria-label="Before: upload, submit is rejected, then fix the dashboard. Now: preflight spots the new permission, you explain it in the dashboard, then upload and submit once." font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans CJK TC", Helvetica, Arial, sans-serif'>
<title>Before: upload, submit is rejected, then fix the dashboard. Now: preflight spots the new permission, you explain it in the dashboard, then upload and submit once.</title>
<style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.ink{fill:#1f2328}.muted{fill:#59636e}
.node{fill:#f6f8fa;stroke:#d1d9e0}
.line{stroke:#818b98;fill:none}.line-fill{fill:#818b98}
.blue-box{fill:#ddf4ff;stroke:#54aeff}.blue{fill:#0969da}.blue-line{stroke:#0969da;fill:none}.blue-fill{fill:#0969da}
.red-box{fill:#ffebe9;stroke:#ff8182}.red{fill:#cf222e}.red-line{stroke:#cf222e;fill:none}.red-fill{fill:#cf222e}
.amber-box{fill:#fff8c5;stroke:#d4a72c}.amber{fill:#9a6700}.amber-line{stroke:#bf8700;fill:none}.amber-fill{fill:#bf8700}
.green-box{fill:#dafbe1;stroke:#4ac26b}.green{fill:#1a7f37}
.lane{fill:#f6f8fa}
.boundary{stroke:#0969da;fill:none}
.num{fill:#1f2328}.num-text{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.ink{fill:#e6edf3}.muted{fill:#9198a1}
.node{fill:#151b23;stroke:#3d444d}
.line{stroke:#656c76}.line-fill{fill:#656c76}
.blue-box{fill:#0c2d6b;stroke:#1f6feb}.blue{fill:#4493f8}.blue-line{stroke:#4493f8}.blue-fill{fill:#4493f8}
.red-box{fill:#3c1618;stroke:#da3633}.red{fill:#ff7b72}.red-line{stroke:#f85149}.red-fill{fill:#f85149}
.amber-box{fill:#3a2a07;stroke:#9e6a03}.amber{fill:#e3b341}.amber-line{stroke:#d29922}.amber-fill{fill:#d29922}
.green-box{fill:#0f2d1a;stroke:#238636}.green{fill:#3fb950}
.lane{fill:#151b23}
.boundary{stroke:#4493f8}
.num{fill:#e6edf3}.num-text{fill:#0d1117}
}</style>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="line-fill"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="blue-fill"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="red-fill"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="amber-fill"/></marker></defs>
<rect x="1" y="1" width="1198" height="334" rx="16" class="bg" stroke-width="1.2"/>
<text x="40" y="44" font-size="20" font-weight="700" text-anchor="start" class="ink">The dashboard step moves from after the upload to before it</text><text x="1123.04" y="44" font-size="12" font-weight="400" text-anchor="start" class="muted">upload</text><rect x="1101.04" y="33" width="14" height="14" rx="3" class="blue-box" stroke-width="1.2"/><text x="957.5999999999999" y="44" font-size="12" font-weight="400" text-anchor="start" class="muted">dashboard (by hand)</text><rect x="935.5999999999999" y="33" width="14" height="14" rx="3" class="amber-box" stroke-width="1.2"/><rect x="24" y="74" width="1152" height="106" rx="12" class="lane" stroke-width="1.2"/><text x="56" y="126" font-size="16" font-weight="700" text-anchor="middle" class="ink">Before</text><rect x="150" y="96" width="88" height="48" rx="10" class="node" stroke-width="1.2"/><text x="194" y="125" font-size="14" font-weight="600" text-anchor="middle" class="ink">Package</text><path d="M242,120 H278" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="284" y="96" width="95" height="48" rx="10" class="blue-box" stroke-width="1.2"/><text x="331.5" y="125" font-size="14" font-weight="600" text-anchor="middle" class="blue">Upload ✓</text><path d="M383,120 H419" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="425" y="96" width="99" height="48" rx="10" class="red-box" stroke-width="1.2"/><text x="474.5" y="125" font-size="14" font-weight="600" text-anchor="middle" class="red">Submit ✗</text><text x="474.5" y="164" font-size="11.5" font-weight="400" text-anchor="middle" class="red">does not meet the requirements</text><path d="M528,120 H564" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="570" y="96" width="223" height="48" rx="10" class="amber-box" stroke-width="1.2"/><text x="681.5" y="125" font-size="14" font-weight="600" text-anchor="middle" class="amber">Find out why, fill dashboard</text><path d="M797,120 H833" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="839" y="96" width="120" height="48" rx="10" class="node" stroke-width="1.2"/><text x="899" y="125" font-size="14" font-weight="600" text-anchor="middle" class="ink">Submit again</text><text x="977" y="125" font-size="13" font-weight="600" text-anchor="start" class="red">an extra round</text><rect x="24" y="200" width="1152" height="106" rx="12" class="lane" stroke-width="1.2"/><text x="56" y="252" font-size="16" font-weight="700" text-anchor="middle" class="ink">Now</text><rect x="150" y="222" width="211" height="48" rx="10" class="node" stroke-width="1.2"/><text x="255.5" y="251" font-size="14" font-weight="600" text-anchor="middle" class="ink">Preflight: new permission</text><text x="255.5" y="290" font-size="11.5" font-weight="400" text-anchor="middle" class="muted">nothing uploaded yet</text><path d="M365,246 H401" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="407" y="222" width="187" height="48" rx="10" class="amber-box" stroke-width="1.2"/><text x="500.5" y="251" font-size="14" font-weight="600" text-anchor="middle" class="amber">Explain it in dashboard</text><path d="M598,246 H634" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="640" y="222" width="77" height="48" rx="10" class="blue-box" stroke-width="1.2"/><text x="678.5" y="251" font-size="14" font-weight="600" text-anchor="middle" class="blue">Upload</text><path d="M721,246 H757" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="763" y="222" width="99" height="48" rx="10" class="green-box" stroke-width="1.2"/><text x="812.5" y="251" font-size="14" font-weight="600" text-anchor="middle" class="green">Submit ✓</text><text x="880" y="251" font-size="13" font-weight="600" text-anchor="start" class="green">first time</text>
</svg>
