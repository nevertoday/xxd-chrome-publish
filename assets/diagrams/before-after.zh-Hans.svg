<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336" role="img" aria-label="以前：上传后提交被拒，再去后台补资料。现在：预检先发现新权限，去后台写好说明后再上传，一次通过。" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans CJK TC", Helvetica, Arial, sans-serif'>
