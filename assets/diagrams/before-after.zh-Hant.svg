<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336" role="img" aria-label="以前：上傳後送審被退回，再到資訊主頁補資料。現在：預檢先發現新權限，寫好說明後再上傳，一次通過。" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans CJK TC", Helvetica, Arial, sans-serif'>
<title>以前：上傳後送審被退回，再到資訊主頁補資料。現在：預檢先發現新權限，寫好說明後再上傳，一次通過。</title>
<style>
