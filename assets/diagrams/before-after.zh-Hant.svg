<text x="40" y="44" font-size="20" font-weight="700" text-anchor="start" class="ink">補資料這一步，從上傳之後挪到了上傳之前</text><text x="1136" y="44" font-size="12" font-weight="400" text-anchor="start" class="muted">上傳</text><rect x="1114" y="33" width="14" height="14" rx="3" class="blue-box" stroke-width="1.2"/><text x="984" y="44" font-size="12" font-weight="400" text-anchor="start" class="muted">到資訊主頁（手動）</text><rect x="962" y="33" width="14" height="14" rx="3" class="amber-box" stroke-width="1.2"/><rect x="24" y="74" width="1152" height="106" rx="12" class="lane" stroke-width="1.2"/><text x="56" y="126" font-size="16" font-weight="700" text-anchor="middle" class="ink">以前</text><rect x="150" y="96" width="60" height="48" rx="10" class="node" stroke-width="1.2"/><text x="180" y="125" font-size="14" font-weight="600" text-anchor="middle" class="ink">打包</text><path d="M214,120 H250" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="256" y="96" width="79" height="48" rx="10" class="blue-box" stroke-width="1.2"/><text x="295.5" y="125" font-size="14" font-weight="600" text-anchor="middle" class="blue">上傳 ✓</text><path d="M339,120 H375" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="381" y="96" width="79" height="48" rx="10" class="red-box" stroke-width="1.2"/><text x="420.5" y="125" font-size="14" font-weight="600" text-anchor="middle" class="red">送審 ✗</text><text x="420.5" y="164" font-size="11.5" font-weight="400" text-anchor="middle" class="red">does not meet the requirements</text><path d="M464,120 H500" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="506" y="96" width="200" height="48" rx="10" class="amber-box" stroke-width="1.2"/><text x="606" y="125" font-size="14" font-weight="600" text-anchor="middle" class="amber">到資訊主頁查原因、補資料</text><path d="M710,120 H746" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="752" y="96" width="74" height="48" rx="10" class="node" stroke-width="1.2"/><text x="789" y="1