e)"/><path d="M294,276 H404" class="amber-line" stroke-width="2" marker-end="url(#a-amber)"/><text x="350" y="266" font-size="12" font-weight="600" text-anchor="middle" class="amber">手动</text><path d="M794,268 H904" class="amber-line" stroke-width="2" marker-end="url(#a-amber)"/><path d="M110,152 V230" class="line" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-line)"/><text x="122" y="196" font-size="12" font-weight="400" text-anchor="start" class="muted">告诉你填什么 + 链接</text><path d="M294,136 H350 V238 H404" class="red-line" stroke-width="1.4" stroke-dasharray="4 4"/><circle cx="350" cy="193" r="10" class="bg"/><path d="M345,188 L355,198 M355,188 L345,198" class="red-line" stroke-width="2"/><text x="368" y="197" font-size="12" font-weight="400" text-anchor="start" class="red">浏览器插件不能操作商店页面</text>
