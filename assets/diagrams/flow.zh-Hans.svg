<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 372" width="1280" height="372" role="img" aria-label="发布流程：构建、检查、打包、和线上版本对比都在上传之前，任何一步出问题都会停下，不上传；之后才上传并提交审核。" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans CJK TC", Helvetica, Arial, sans-serif'>
<title>发布流程：构建、检查、打包、和线上版本对比都在上传之前，任何一步出问题都会停下，不上传；之后才上传并提交审核。</title>
<style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.ink{fill:#1f2328}.muted{fill:#59636e}
.node{fill:#f6f8fa;stroke:#d1d9e0}
.line{stroke:#818b98;fill:none}.line-fill{fill:#818b98}
.blue-box{fill:#ddf4ff;stroke:#54aeff}.blue{fill:#0969da}.blue-line{stroke:#0969da;fill:none}.blue-fill{fill:#0969da}
.red-box{fill:#ffebe9;stroke:#ff8182}.red{fill:#cf222e}.red-line{stroke:#cf222e;fill:none}.red-fill{fill:#cf222e}
.amber-box{fill:#fff8c5;stroke:#d4a72c}.amber{fill:#9a6700}.amber-line{stroke:#bf8700;fill:none}.amber-fill{fill:#bf8700}
.green-box{fill:#dafbe1;stroke:#4ac26b}.green{fill:#1a7f37}
.lane{fill:#f6f8fa}
.boundary{stroke:#0969da;fill:none}
.num{fill:#1f2328}.num-text{fill:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.ink{fill:#e6edf3}.muted{fill:#9198a1}
.node{fill:#151b23;stroke:#3d444d}
.line{stroke:#656c76}.line-fill{fill:#656c76}
.blue-box{fill:#0c2d6b;stroke:#1f6feb}.blue{fill:#4493f8}.blue-line{stroke:#4493f8}.blue-fill{fill:#4493f8}
.red-box{fill:#3c1618;stroke:#da3633}.red{fill:#ff7b72}.red-line{stroke:#f85149}.red-fill{fill:#f85149}
.amber-box{fill:#3a2a07;stroke:#9e6a03}.amber{fill:#e3b341}.amber-line{stroke:#d29922}.amber-fill{fill:#d29922}
.green-box{fill:#0f2d1a;stroke:#238636}.green{fill:#3fb950}
.lane{fill:#151b23}
.boundary{stroke:#4493f8}
.num{fill:#e6edf3}.num-text{fill:#0d1117}
}</style>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="line-fill"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="blue-fill"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="red-fill"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="amber-fill"/></marker></defs>
<rect x="1" y="1" width="1278" height="370" rx="16" class="bg" stroke-width="1.2"/>
<text x="40" y="44" font-size="20" font-weight="700" text-anchor="start" class="ink">一次发布，经过这 6 步</text><text x="415" y="82" font-size="13" font-weight="400" text-anchor="middle" class="muted">在你的电脑上：任何一步出问题就停下，什么都不上传</text><text x="1065" y="82" font-size="13" font-weight="400" text-anchor="middle" class="muted">商店</text><line x1="840" y1="64" x2="840" y2="354" class="boundary" stroke-width="1.6" stroke-dasharray="6 5"/><text x="840" y="60" font-size="12" font-weight="600" text-anchor="middle" class="blue">上传线</text><rect x="40" y="104" width="150" height="64" rx="10" class="node" stroke-width="1.2"/><circle cx="62" cy="126" r="11" class="num"/><text x="62" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">1</text><text x="80" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">构建</text><text x="56" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">跑 build 脚本</text><path d="M194,136 H234" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="240" y="104" width="150" height="64" rx="10" class="node" stroke-width="1.2"/><circle cx="262" cy="126" r="11" class="num"/><text x="262" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">2</text><text x="280" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">检查</text><text x="256" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">跑 check 脚本</text><path d="M394,136 H434" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="440" y="104" width="150" height="64" rx="10" class="node" stroke-width="1.2"/><circle cx="462" cy="126" r="11" class="num"/><text x="462" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">3</text><text x="480" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">打包</text><text x="456" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">找齐所有文件</text><path d="M594,136 H634" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="640" y="104" width="150" height="64" rx="10" class="node" stroke-width="1.2"/><circle cx="662" cy="126" r="11" class="num"/><text x="662" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">4</text><text x="680" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">对比</text><text x="656" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">和线上版本比</text><path d="M794,136 H884" class="blue-line" stroke-width="1.6" marker-end="url(#a-blue)"/><rect x="890" y="104" width="150" height="64" rx="10" class="blue-box" stroke-width="1.2"/><circle cx="912" cy="126" r="11" class="num"/><text x="912" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">5</text><text x="930" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">上传</text><text x="906" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">传到商店</text><path d="M1044,136 H1084" class="line" stroke-width="1.6" marker-end="url(#a-line)"/><rect x="1090" y="104" width="150" height="64" rx="10" class="blue-box" stroke-width="1.2"/><circle cx="1112" cy="126" r="11" class="num"/><text x="1112" y="130.5" font-size="12" font-weight="700" text-anchor="middle" class="num-text">6</text><text x="1130" y="131" font-size="15" font-weight="700" text-anchor="start" class="ink">提交</text><text x="1106" y="154" font-size="11.5" font-weight="400" text-anchor="start" class="muted">进入审核</text><path d="M115,172 V227" class="red-line" stroke-width="1.3" marker-end="url(#a-red)"/><path d="M315,172 V227" class="red-line" stroke-width="1.3" marker-end="url(#a-red)"/><rect x="85" y="232" width="260" height="50" rx="8" class="red-box" stroke-width="1.2"/><text x="215" y="253" font-size="13" font-weight="600" text-anchor="middle" class="red">失败</text><text x="215" y="271" font-size="13" font-weight="400" text-anchor="middle" class="red">→ 停下，不上传</text><path d="M515,172 V227" class="red-line" stroke-width="1.3" marker-end="url(#a-red)"/><rect x="482" y="232" width="67" height="50" rx="8" class="red-box" stroke-width="1.2"/><text x="515" y="253" font-size="13" font-weight="600" text-anchor="middle" class="red">缺文件</text><text x="515" y="271" font-size="13" font-weight="400" text-anchor="middle" class="red">→ 停下</text><path d="M715,172 V227" class="amber-line" stroke-width="1.3" marker-end="url(#a-amber)"/><path d="M655,282 V298" class="line" stroke-width="1.2" stroke-dasharray="3 3"/><text x="649" y="294" font-size="11" font-weight="400" text-anchor="end" class="muted">或</text><rect x="650" y="232" width="131" height="50" rx="8" class="amber-box" stroke-width="1.2"/><text x="715" y="253" font-size="13" font-weight="600" text-anchor="middle" class="amber">有新权限</text><text x="715" y="271" font-size="13" font-weight="400" text-anchor="middle" class="amber">→ 先去后台写说明</text><rect x="662" y="298" width="106" height="50" rx="8" class="node" stroke-width="1.2"/><text x="715" y="319" font-size="13" font-weight="600" text-anchor="middle" class="ink">有版本在审核</text><text x="715" y="337" font-size="13" font-weight="400" text-anchor="middle" class="muted">→ 先等</text><path d="M785,257 H965 V174" class="amber-line" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="902.5" y="248" font-size="12" font-weight="400" text-anchor="middle" class="amber">填好后再跑</text><path d="M1165,172 V227" class="line" stroke-width="1.3" marker-end="url(#a-line)"/><path d="M1215,282 V298" class="line" stroke-width="1.2" stroke-dasharray="3 3"/><text x="1221" y="294" font-size="11" font-weight="400" text-anchor="start" class="muted">或</text><rect x="1093" y="232" width="144" height="50" rx="8" class="green-box" stroke-width="1.2"/><text x="1165" y="253" font-size="13" font-weight="600" text-anchor="middle" class="green">审核中</text><text x="1165" y="271" font-size="13" font-weight="400" text-anchor="middle" class="green">PENDING_REVIEW</text><rect x="1096" y="298" width="139" height="50" rx="8" class="node" stroke-width="1.2"/><text x="1165" y="319" font-size="13" font-weight="600" text-anchor="middle" class="ink">被拒？补完后台</text><text x="1165" y="337" font-size="13" font-weight="400" text-anchor="middle" class="muted">→ submit 重新提交</text>
</svg>
